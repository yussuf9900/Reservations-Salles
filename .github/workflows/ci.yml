name: CI — Tests & Qualité

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'refactor/**'
      - 'fix/**'
  pull_request:
    branches:
      - main

jobs:
  lint:
    name: Lint PHP
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Vérification syntaxe PHP
        run: find src/ templates/ public/ config/ routes/ -name "*.php" -print0 | xargs -0 -n1 php -l

  tests:
    name: Tests PHP ${{ matrix.php-version }}
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.2', '8.3']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: pdo, pdo_mysql, mbstring, intl
          coverage: none

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ matrix.php-version }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ matrix.php-version }}-

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-suggest

      - name: Run PHPUnit
        run: ./vendor/bin/phpunit tests/Unit tests/Http --testdox
