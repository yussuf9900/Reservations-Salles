services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: reservations-salles:latest
    container_name: reservation_salles_app
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      APP_ENV: development
      APP_DEBUG: "true"
      DB_DRIVER: mysql
      DB_HOST: database
      DB_PORT: 3306
      DB_DATABASE: reservation_salles
      DB_USERNAME: root
      DB_PASSWORD: ""
    depends_on:
      database:
        condition: service_healthy

  database:
    image: mysql:8.0
    container_name: reservation_salles_db
    restart: unless-stopped
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: reservation_salles
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  db_data:
