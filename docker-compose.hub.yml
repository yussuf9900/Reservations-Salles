services:
  app:
    image: ${DOCKER_IMAGE:-devyussuf/reservations-salles:latest}
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_RESPONSE_FORMAT: ${APP_RESPONSE_FORMAT:-html}
      DB_DRIVER: mysql
      DB_HOST: database
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-reservation_salles}
      DB_USERNAME: ${DOCKER_DB_USERNAME:-reservation_app}
      DB_PASSWORD: ${DOCKER_DB_PASSWORD:-reservation_local}
    depends_on:
      database:
        condition: service_healthy

    volumes:
      - app_sessions:/var/lib/php/sessions

  database:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DOCKER_DB_ROOT_PASSWORD:-root_local}
      MYSQL_USER: ${DOCKER_DB_USERNAME:-reservation_app}
      MYSQL_PASSWORD: ${DOCKER_DB_PASSWORD:-reservation_local}
      MYSQL_DATABASE: ${DB_DATABASE:-reservation_salles}
    ports:
      - "${FORWARD_DB_PORT:-3307}:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql --protocol=TCP -h 127.0.0.1 -u $$MYSQL_USER $$MYSQL_DATABASE -e 'SELECT 1' >/dev/null"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 30s

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    restart: unless-stopped
    ports:
      - "${PMA_PORT:-8081}:80"
    environment:
      PMA_HOST: database
      PMA_PORT: 3306
      PMA_ALLOW_EMPTY_PASSWORD: "yes"
      UPLOAD_LIMIT: 64M
    depends_on:
      database:
        condition: service_healthy

volumes:
  db_data:
  app_sessions:
