services:
  app:
    image: ${DOCKER_IMAGE:-devyussuf/reservations-salles:latest}
    container_name: reservation_salles_app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_RESPONSE_FORMAT: ${APP_RESPONSE_FORMAT:-html}
      DB_DRIVER: mysql
      DB_HOST: database
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-reservation_salles}
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD:-}
    depends_on:
      database:
        condition: service_healthy

  database:
    image: mysql:8.0
    container_name: reservation_salles_db
    restart: unless-stopped
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: ${DB_DATABASE:-reservation_salles}
    ports:
      - "${FORWARD_DB_PORT:-3306}:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 5s

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: reservation_salles_pma
    restart: unless-stopped
    ports:
      - "${PMA_PORT:-8081}:80"
    environment:
      PMA_HOST: database
      PMA_PORT: 3306
      PMA_ALLOW_EMPTY_PASSWORD: "yes"
      UPLOAD_LIMIT: 64M
    depends_on:
      database:
        condition: service_healthy

volumes:
  db_data:
